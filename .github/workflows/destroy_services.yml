name: Destroy Remote Database

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Srodowisko do usuniecia"
        required: true
        default: env-test
        type: choice
        options:
          - env-test
          - env-qa
          - main
      confirmation:
        description: "Wpisz USUN, aby potwierdzic usuniecie danych"
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy-db:
    runs-on: self-hosted
    if: ${{ inputs.confirmation == 'USUN' }}

    environment:
      name: ${{ inputs.target_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_environment }}

      - name: Destroy PostGIS and database volume
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          docker compose -f docker-compose-remote.yml -p "remote-db-$ENVIRONMENT" down --volumes

      - name: Show remaining containers
        env:
          ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          docker ps -a --filter "label=com.docker.compose.project=remote-db-$ENVIRONMENT"